<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开发者管理中心 - RunningHub Admin Console</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            admin: {
              50: '#f8fafc',
              800: '#1e293b',
              900: '#0f172a',
              950: '#020617'
            }
          }
        }
      }
    }
  </script>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    [v-cloak] { display: none; }
    /* 自定义滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen font-sans antialiased flex flex-col md:flex-row overflow-x-hidden selection:bg-indigo-500 selection:text-white">

  <div id="app" v-cloak class="flex-1 flex flex-col md:flex-row min-h-screen w-full">

    <!-- 独立管理员控制台登录网关 (当未登录或非管理员时呈现，与普通用户登录彻底物理分离) -->
    <div v-if="authChecked && (!currentUser || currentUser.role !== 'admin')" class="fixed inset-0 z-50 bg-[#090d16] flex flex-col items-center justify-center p-4 sm:p-6 relative overflow-hidden">
      <!-- 极客氛围流光 -->
      <div class="absolute -top-32 -left-32 w-80 h-80 bg-indigo-600/15 rounded-full blur-[100px] pointer-events-none"></div>
      <div class="absolute -bottom-32 -right-32 w-80 h-80 bg-purple-600/15 rounded-full blur-[100px] pointer-events-none"></div>
      <div class="absolute inset-0 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:24px_24px] opacity-40 pointer-events-none"></div>

      <div class="w-full max-w-sm bg-slate-900/90 border border-slate-700/80 rounded-3xl p-6 sm:p-8 shadow-2xl relative z-10 backdrop-blur-xl">
        <div class="text-center mb-6">
          <div class="w-12 h-12 mx-auto rounded-2xl bg-gradient-to-tr from-amber-500 via-indigo-600 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/25 text-white font-bold mb-3">
            <i data-lucide="shield" class="w-6 h-6"></i>
          </div>
          <h2 class="text-lg font-bold text-white tracking-wide">超级管理控制台</h2>
          <p class="text-[11px] text-slate-400 mt-1">专属管理通道 · 仅限系统超级管理员登录</p>
        </div>

        <div v-if="adminLoginError" class="mb-4 p-2.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2">
          <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 text-rose-400"></i>
          <span class="flex-1">{{ adminLoginError }}</span>
        </div>

        <form @submit.prevent="submitAdminLogin" class="space-y-4 text-xs">
          <div>
            <label class="block text-slate-300 font-medium mb-1.5">管理员账号 / 邮箱</label>
            <input 
              v-model="adminLoginForm.identifier" 
              type="text" 
              required 
              placeholder="输入管理员用户名" 
              class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500 transition">
          </div>
          <div>
            <label class="block text-slate-300 font-medium mb-1.5">管理员密码</label>
            <input 
              v-model="adminLoginForm.password" 
              type="password" 
              required 
              placeholder="••••••••" 
              class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500 transition">
          </div>
          <button 
            type="submit" 
            :disabled="adminLoginLoading"
            class="w-full mt-2 py-2.5 px-4 rounded-xl font-bold text-white bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 shadow-md shadow-indigo-600/30 disabled:opacity-50 transition flex items-center justify-center gap-2">
            <span v-if="adminLoginLoading" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin inline-block"></span>
            <span>{{ adminLoginLoading ? '正在核验身份...' : '验证并进入控制台' }}</span>
          </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-800 text-center">
          <a href="/" class="text-[11px] text-slate-400 hover:text-white transition flex items-center justify-center gap-1">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
            <span>返回前台创作台</span>
          </a>
        </div>
      </div>
    </div>

    <!-- 主管理员界面 (仅在管理员鉴权通过后渲染) -->
    <template v-if="authChecked && currentUser && currentUser.role === 'admin'">
      
      <!-- 侧边栏 (Sidebar) -->
      <aside class="w-full md:w-64 bg-slate-950/90 border-r border-slate-800/80 flex flex-col justify-between shrink-0">
        <div>
          <!-- 侧边栏头部 -->
          <div class="p-5 border-b border-slate-800/80 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i data-lucide="shield" class="w-5 h-5 text-white"></i>
              </div>
              <div>
                <div class="text-sm font-bold text-white tracking-wide">开发者控制台</div>
                <div class="text-[10px] text-indigo-400 font-mono">RunningHub Enterprise</div>
              </div>
            </div>
            <span class="text-[9px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-1.5 py-0.5 rounded font-mono font-bold">ADMIN</span>
          </div>

          <!-- 导航菜单 -->
          <nav class="p-3 space-y-1">
            <button 
              @click="activeSection = 'overview'" 
              :class="activeSection === 'overview' ? 'bg-indigo-600/15 text-indigo-400 border border-indigo-500/30 font-semibold' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200 border border-transparent'"
              class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs transition duration-150">
              <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
              <span>系统运行概览</span>
            </button>

            <button 
              @click="activeSection = 'users'" 
              :class="activeSection === 'users' ? 'bg-indigo-600/15 text-indigo-400 border border-indigo-500/30 font-semibold' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200 border border-transparent'"
              class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs transition duration-150">
              <div class="flex items-center gap-3">
                <i data-lucide="users" class="w-4 h-4"></i>
                <span>用户中心与权限</span>
              </div>
              <span class="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded-full font-mono">{{ users.length }}</span>
            </button>

            <!-- 官方公告管理 (全新增加) -->
            <button 
              @click="activeSection = 'announcements'" 
              :class="activeSection === 'announcements' ? 'bg-indigo-600/15 text-indigo-400 border border-indigo-500/30 font-semibold' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200 border border-transparent'"
              class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs transition duration-150">
              <div class="flex items-center gap-3">
                <i data-lucide="megaphone" class="w-4 h-4"></i>
                <span>官方公告与动态</span>
              </div>
              <span class="text-[10px] bg-indigo-950 text-indigo-400 px-1.5 py-0.5 rounded-full font-mono">{{ announcements.length }}</span>
            </button>

            <button 
              @click="activeSection = 'security'" 
              :class="activeSection === 'security' ? 'bg-indigo-600/15 text-indigo-400 border border-indigo-500/30 font-semibold' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200 border border-transparent'"
              class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs transition duration-150">
              <i data-lucide="shield-check" class="w-4 h-4"></i>
              <span>安全防护 & Turnstile</span>
            </button>

            <button 
              @click="activeSection = 'tasks'" 
              :class="activeSection === 'tasks' ? 'bg-indigo-600/15 text-indigo-400 border border-indigo-500/30 font-semibold' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200 border border-transparent'"
              class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs transition duration-150">
              <i data-lucide="activity" class="w-4 h-4"></i>
              <span>全局任务审计流</span>
            </button>

            <!-- 工作流调度与治理 (全新) -->
            <button 
              @click="activeSection = 'workflows'; loadWorkflows()" 
              :class="activeSection === 'workflows' ? 'bg-indigo-600/15 text-indigo-400 border border-indigo-500/30 font-semibold' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200 border border-transparent'"
              class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs transition duration-150">
              <div class="flex items-center gap-3">
                <i data-lucide="git-merge" class="w-4 h-4"></i>
                <span>工作流调度与上下架</span>
              </div>
              <span class="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded-full font-mono">{{ workflows.length }}</span>
            </button>

                        <!-- 卡密发行与核销对账 (全新) -->
            <button 
              @click="activeSection = 'cdkeys'; loadCdkeys(1)" 
              :class="activeSection === 'cdkeys' ? 'bg-indigo-600/15 text-indigo-400 border border-indigo-500/30 font-semibold' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200 border border-transparent'"
              class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs transition duration-150">
              <div class="flex items-center gap-3">
                <i data-lucide="ticket" class="w-4 h-4"></i>
                <span>卡密发行与对账</span>
              </div>
              <span class="text-[10px] bg-emerald-950 text-emerald-400 px-1.5 py-0.5 rounded-full font-mono font-bold">{{ cdkeyStats.unusedCount || 0 }}</span>
            </button>

            <button 
              @click="activeSection = 'keys'" 
              :class="activeSection === 'keys' ? 'bg-indigo-600/15 text-indigo-400 border border-indigo-500/30 font-semibold' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200 border border-transparent'"
              class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs transition duration-150">
              <i data-lucide="key" class="w-4 h-4"></i>
              <span>API 密钥池调度</span>
            </button>

            <button 
              @click="activeSection = 'gallery'" 
              :class="activeSection === 'gallery' ? 'bg-indigo-600/15 text-indigo-400 border border-indigo-500/30 font-semibold' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200 border border-transparent'"
              class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs transition duration-150">
              <div class="flex items-center gap-3">
                <i data-lucide="image" class="w-4 h-4"></i>
                <span>全站画廊 & 图床资产</span>
              </div>
              <span class="text-[10px] bg-indigo-950 text-indigo-400 px-1.5 py-0.5 rounded-full font-mono">{{ adminGallery.length }}</span>
            </button>
          </nav>
        </div>

        <!-- 侧边栏底部信息 -->
        <div class="p-4 border-t border-slate-800/80 bg-slate-950">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-full bg-indigo-600/20 border border-indigo-500/40 text-indigo-300 font-bold flex items-center justify-center text-xs">
                {{ (currentUser.username || 'A')[0].toUpperCase() }}
              </div>
              <div class="overflow-hidden">
                <div class="text-xs font-bold text-white truncate">{{ currentUser.username }}</div>
                <div class="text-[10px] text-emerald-400 flex items-center gap-1">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>管理员在线</span>
                </div>
              </div>
            </div>
            <button @click="logoutAdmin" title="退出管理后台" class="p-1.5 rounded-lg text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 transition">
              <i data-lucide="log-out" class="w-4 h-4"></i>
            </button>
          </div>

          <a href="/" class="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700/80 text-xs font-semibold text-slate-300 hover:text-white transition shadow-sm">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
            <span>打开前台创作台</span>
          </a>
        </div>
      </aside>

      <!-- 右侧主内容区 (Main Content) -->
      <main class="flex-1 flex flex-col min-h-screen overflow-y-auto">
        
        <!-- 顶部状态栏 -->
        <header class="h-16 border-b border-slate-800/80 bg-[#0d1322]/80 backdrop-blur-md px-6 flex items-center justify-between shrink-0 sticky top-0 z-20">
          <div class="flex items-center gap-3">
            <h1 class="text-base font-bold text-white flex items-center gap-2">
              <span>{{ sectionTitles[activeSection] }}</span>
            </h1>
          </div>

          <!-- 系统状态胶囊 & 刷新 -->
          <div class="flex items-center gap-3">
            <div class="hidden sm:flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900 border border-slate-800 text-[11px] text-slate-400">
              <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
              <span>SQLite WAL 模式 (事务并发防护)</span>
            </div>
            <button 
              @click="refreshCurrentSection" 
              :disabled="loading" 
              class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:bg-slate-800 transition">
              <i data-lucide="refresh-cw" :class="loading ? 'animate-spin' : ''" class="w-4 h-4"></i>
            </button>
          </div>
        </header>

        <!-- 内容视窗容器 -->
        <div class="p-6 max-w-7xl w-full mx-auto space-y-6">

          <!-- 1. 系统概览视图 (Overview) -->
          <section v-if="activeSection === 'overview'" class="space-y-6">
            
            <!-- KPI 核心指标卡 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              
              <div class="bg-slate-900/90 border border-slate-800/90 rounded-2xl p-5 shadow-sm">
                <div class="flex items-center justify-between text-slate-400 mb-2">
                  <span class="text-xs font-medium">总注册用户</span>
                  <i data-lucide="users" class="w-4 h-4 text-indigo-400"></i>
                </div>
                <div class="text-2xl font-bold font-mono text-white">{{ overview.totalUsers || 0 }}</div>
                <div class="mt-2 text-[11px] text-emerald-400 flex items-center gap-1">
                  <i data-lucide="check" class="w-3 h-3"></i>
                  <span>正常活跃: {{ overview.activeUsers || 0 }} 人</span>
                </div>
              </div>

              <div class="bg-slate-900/90 border border-slate-800/90 rounded-2xl p-5 shadow-sm">
                <div class="flex items-center justify-between text-slate-400 mb-2">
                  <span class="text-xs font-medium">累计渲染任务</span>
                  <i data-lucide="cpu" class="w-4 h-4 text-purple-400"></i>
                </div>
                <div class="text-2xl font-bold font-mono text-white">{{ overview.totalTasks || 0 }}</div>
                <div class="mt-2 text-[11px] text-slate-400">今日新增: {{ overview.todayTasks || 0 }} 次</div>
              </div>

              <div class="bg-slate-900/90 border border-slate-800/90 rounded-2xl p-5 shadow-sm">
                <div class="flex items-center justify-between text-slate-400 mb-2">
                  <span class="text-xs font-medium">累计代币消耗</span>
                  <i data-lucide="coins" class="w-4 h-4 text-amber-400"></i>
                </div>
                <div class="text-2xl font-bold font-mono text-amber-400">{{ overview.totalCoinsUsed || 0 }}</div>
                <div class="mt-2 text-[11px] text-slate-400">成功完成: {{ overview.successTasks || 0 }} 笔</div>
              </div>

              <div class="bg-slate-900/90 border border-slate-800/90 rounded-2xl p-5 shadow-sm">
                <div class="flex items-center justify-between text-slate-400 mb-2">
                  <span class="text-xs font-medium">Cloudflare 防御</span>
                  <i data-lucide="shield" class="w-4 h-4 text-cyan-400"></i>
                </div>
                <div class="text-sm font-bold flex items-center gap-1.5 mt-1">
                  <span v-if="overview.turnstileConfigured && overview.turnstileEnabled" class="text-emerald-400 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 强效防护中
                  </span>
                  <span v-else-if="overview.turnstileConfigured" class="text-amber-400 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-amber-400"></span> 已配置(未启用)
                  </span>
                  <span v-else class="text-slate-500 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-slate-600"></span> 未绑定
                  </span>
                </div>
                <div class="mt-2 text-[11px] text-slate-500 font-mono truncate">
                  {{ overview.turnstileSiteKey || '前往安全设置绑定' }}
                </div>
              </div>

            </div>

            <!-- 全站实时广播与维护模式控制台 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              
              <!-- 1. 全站维护模式应急控制卡片 -->
              <div class="bg-slate-900/90 border border-slate-800/90 rounded-2xl p-5 space-y-4 shadow-sm"
                   :class="maintenanceForm.enabled ? 'border-rose-800/80 bg-rose-950/20' : ''">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-xl flex items-center justify-center font-bold"
                         :class="maintenanceForm.enabled ? 'bg-rose-600/20 text-rose-400 border border-rose-500/30' : 'bg-slate-800 text-slate-400'">
                      🚨
                    </div>
                    <div>
                      <h3 class="text-sm font-bold text-white flex items-center gap-2">
                        <span>全站维护模式开关</span>
                        <span v-if="maintenanceForm.enabled" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-500/20 text-rose-400 border border-rose-500/40 animate-pulse">
                          ● 正在维护中 (全员拦截)
                        </span>
                        <span v-else class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                          ● 正常运转中
                        </span>
                      </h3>
                      <p class="text-xs text-slate-400 mt-0.5">开启后阻断非管理员提交新生成任务，阻断云端代币消耗</p>
                    </div>
                  </div>

                  <button 
                    @click="toggleMaintenance" 
                    :class="maintenanceForm.enabled ? 'bg-rose-600 hover:bg-rose-500 text-white shadow-rose-900/50' : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700'"
                    class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition shadow-lg flex items-center gap-1.5">
                    <span>{{ maintenanceForm.enabled ? '解除维护恢复全站' : '开启全站维护' }}</span>
                  </button>
                </div>

                <div class="space-y-2">
                  <label class="text-xs text-slate-400 font-medium">维护通知文案 (向普通用户展示)</label>
                  <div class="flex gap-2">
                    <input 
                      type="text" 
                      v-model="maintenanceForm.message" 
                      placeholder="例如：系统正在进行云端节点升级维护，暂不可提交新任务，请稍后访问。"
                      class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-rose-500">
                    <button 
                      @click="saveMaintenanceMessage" 
                      class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700 transition">
                      保存通知
                    </button>
                  </div>
                </div>
              </div>

              <!-- 2. 全站实时广播与通知横幅控制卡片 -->
              <div class="bg-slate-900/90 border border-slate-800/90 rounded-2xl p-5 space-y-4 shadow-sm"
                   :class="broadcastForm.enabled ? 'border-indigo-800/80 bg-indigo-950/15' : ''">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-xl flex items-center justify-center font-bold"
                         :class="broadcastForm.enabled ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'bg-slate-800 text-slate-400'">
                      📢
                    </div>
                    <div>
                      <h3 class="text-sm font-bold text-white flex items-center gap-2">
                        <span>全站实时广播横幅</span>
                        <span v-if="broadcastForm.enabled" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-indigo-500/20 text-indigo-400 border border-indigo-500/40">
                          ● 广播展示中
                        </span>
                        <span v-else class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-slate-400">
                          已关闭
                        </span>
                      </h3>
                      <p class="text-xs text-slate-400 mt-0.5">置顶悬浮在用户端顶部，毫秒级同步推送平台通知与活动</p>
                    </div>
                  </div>

                  <label class="relative inline-flex items-center cursor-pointer">

                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60">

                      </td>
                    </tr>
                  </tbody>
                </table>

            </div>

          <!-- 6. 密钥池调度视图 (Keys) -->
          <section v-if="activeSection === 'keys'" class="space-y-4">
            
            <div class="bg-slate-900/90 border border-slate-800/90 rounded-2xl p-5 space-y-4">
              
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <span>RunningHub API 密钥池安全中心</span>
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">无感故障转移已启用</span>
                  </h3>
                  <p class="text-xs text-slate-400 mt-0.5">AES-256 高强度加密存储，多账号自动轮询调度。遇到封禁、注销或欠费时自动熔断隔离并邮件告警</p>
                </div>
                <div class="flex items-center gap-2">
                  <button @click="inspectAllKeys" :disabled="isInspectingKeys" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-sky-400 border border-slate-700/80 transition flex items-center gap-1.5 shadow-sm">
                    <i data-lucide="activity" :class="{'animate-spin': isInspectingKeys}" class="w-3.5 h-3.5 text-sky-400"></i>
                    <span>{{ isInspectingKeys ? '巡检中...' : '一键全池巡检' }}</span>
                  </button>
                  <button @click="openSmtpModal" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-amber-300 border border-slate-700/80 transition flex items-center gap-1.5 shadow-sm">
                    <i data-lucide="mail" class="w-3.5 h-3.5 text-amber-400"></i>
                    <span>告警邮箱设置</span>
                  </button>
                  <button @click="showAddKeyModal = true" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold text-white transition flex items-center gap-1.5 shadow-sm">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    <span>添加新密钥</span>
                  </button>
                </div>
              </div>

              <!-- 动态并发池调度运行看板 (Key Pool Mutex Live Status) -->
              <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                <div class="p-3.5 rounded-xl bg-slate-950/80 border border-slate-800">
                  <div class="text-[11px] text-slate-400 font-medium">全池账号总量</div>
                  <div class="text-xl font-bold text-white mt-1 font-mono">{{ keyPoolStats.totalKeys || keys.length }} <span class="text-[10px] text-slate-500 font-sans">个</span></div>
                  <div class="text-[10px] text-indigo-400 mt-1">独立单线程并发</div>
                </div>
                <div class="p-3.5 rounded-xl bg-slate-950/80 border border-emerald-500/30 bg-emerald-500/5">
                  <div class="text-[11px] text-emerald-400 font-medium">健康待命中 (Idle)</div>
                  <div class="text-xl font-bold text-emerald-300 mt-1 font-mono">{{ keyPoolStats.freeKeys ?? keys.length }} <span class="text-[10px] text-emerald-500/70 font-sans">槽位</span></div>
                  <div class="text-[10px] text-emerald-400/80 mt-1">毫秒级极速接单</div>
                </div>
                <div class="p-3.5 rounded-xl bg-slate-950/80 border border-rose-500/30 bg-rose-500/5">
                  <div class="text-[11px] text-rose-400 font-medium">GPU 渲染中 (Busy)</div>
                  <div class="text-xl font-bold text-rose-300 mt-1 font-mono">{{ keyPoolStats.busyKeys || 0 }} <span class="text-[10px] text-rose-500/70 font-sans">占用</span></div>

                <div class="p-3.5 rounded-xl bg-slate-950/80 border border-red-500/30 bg-red-950/20">

                  <div class="text-[10px] text-amber-400/80 mt-1">释放时毫秒级抢占</div>
                </div>
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                  <thead>
                    <tr class="border-b border-slate-800 text-slate-400">

                      <th class="py-3 px-3">安全掩码</th>
                      <th class="py-3 px-3">当前状态</th>

                      <th class="py-3 px-3 text-right">操作</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60">
                    <tr v-for="k in keys" :key="k.id" class="hover:bg-slate-800/30 transition">
                      <td class="py-3 px-3 font-semibold text-white">
                        <div class="flex items-center gap-2">
                          <span>{{ k.name }}</span>
                          <span v-if="k.isActive" class="px-1.5 py-0.2 rounded text-[9px] font-mono bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">主Key</span>
                        </div>
                      </td>
                      <td class="py-3 px-3 font-mono text-indigo-300">{{ k.maskedKey }}</td>
                      <td class="py-3 px-3">
                        <div class="flex flex-col gap-1 items-start">

                          <div v-if="getKeyPoolItem(k.id) && !getKeyPoolItem(k.id).isHealthy" class="flex items-center gap-1.5">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-red-500/15 text-red-400 border border-red-500/30 flex items-center gap-1" :title="getKeyPoolItem(k.id).healthError">
                              <span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>
                              <span>⛔ 熔断隔离 (已被封禁/失效)</span>

                          </div>
                          <!-- 正在渲染 -->
                          <div v-else-if="getKeyPoolItem(k.id)?.isBusy" class="flex items-center gap-1.5">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-500/15 text-rose-400 border border-rose-500/30 flex items-center gap-1 animate-pulse">
                              <span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>
                              <span>GPU 渲染中 ({{ getKeyPoolItem(k.id)?.busyDuration }}s)</span>
                            </span>
                          </div>
                          <!-- 健康空闲待命 -->
                          <div v-else class="flex items-center gap-1.5">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 flex items-center gap-1">
                              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                              <span>🟢 健康待命</span>
                            </span>
                          </div>

                          <!-- 报错详情诊断提示 -->
                          <div v-if="getKeyPoolItem(k.id) && !getKeyPoolItem(k.id).isHealthy && getKeyPoolItem(k.id).healthError" class="text-[10px] text-red-400/90 font-mono truncate max-w-xs" :title="getKeyPoolItem(k.id).healthError">
                            {{ getKeyPoolItem(k.id).healthError }}
                          </div>
                        </div>
                      </td>
                      <td class="py-3 px-3 text-slate-400">{{ formatTimestamp(k.createdAt) }}</td>
                      <td class="py-3 px-3 text-right space-x-1 whitespace-nowrap">

                        <button @click="deleteKey(k.id)" class="px-2 py-1 rounded bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 text-[11px]">删除</button>
                      </td>
                    </tr>
                  </tbody>
                </table>

            <!-- 统计看板 -->

        leave-active-class="transition duration-200 ease-in transform" 
        leave-from-class="translate-y-0 opacity-100 scale-100" 
        leave-to-class="-translate-y-6 opacity-0 scale-95">
        <div 
          v-if="toastState.show" 
          class="fixed top-6 left-1/2 -translate-x-1/2 z-[9999] pointer-events-auto">
          <div 
            :class="{
              'border-emerald-500/50 bg-slate-900/95 text-emerald-300 shadow-emerald-950/40': toastState.type === 'success',
              'border-rose-500/50 bg-slate-900/95 text-rose-300 shadow-rose-950/40': toastState.type === 'error',
              'border-amber-500/50 bg-slate-900/95 text-amber-300 shadow-amber-950/40': toastState.type === 'warning',
              'border-indigo-500/50 bg-slate-900/95 text-indigo-300 shadow-indigo-950/40': toastState.type === 'info'
            }"
            class="border px-5 py-3 rounded-2xl shadow-2xl backdrop-blur-xl flex items-center gap-3 text-xs min-w-[280px] max-w-lg transition-all duration-300">
            <span 
              :class="{
                'bg-emerald-500/20 text-emerald-400': toastState.type === 'success',
                'bg-rose-500/20 text-rose-400': toastState.type === 'error',
                'bg-amber-500/20 text-amber-400': toastState.type === 'warning',
                'bg-indigo-500/20 text-indigo-400': toastState.type === 'info'
              }"
              class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0">
              <span v-if="toastState.type === 'success'">✓</span>
              <span v-else-if="toastState.type === 'error'">✕</span>
              <span v-else-if="toastState.type === 'warning'">!</span>
              <span v-else>ℹ</span>
            </span>
            <span class="font-medium text-slate-100 flex-1 leading-normal">{{ toastState.message }}</span>
            <button 
              @click="toastState.show = false" 
              class="text-slate-400 hover:text-white transition ml-2 text-sm leading-none p-1">
              ✕
            </button>
          </div>
        </div>
      </transition>

    </template>

  </div>

  <script>
    const { createApp, ref, computed, onMounted, nextTick, watch } = Vue;

    createApp({
      setup() {
        const authChecked = ref(false);
        const currentUser = ref(null);
        const activeSection = ref('overview');
        const loading = ref(false);
        const savingSettings = ref(false);

        // 现代化交互通知与确认系统
        const toastState = ref({ show: false, message: '', type: 'info' });
        let toastTimer = null;
        const showToastNotification = (msg, type = 'info') => {
          if (toastTimer) clearTimeout(toastTimer);
          toastState.value = { show: true, message: String(msg), type };
          toastTimer = setTimeout(() => { toastState.value.show = false; }, 4000);
        };

        const confirmModal = ref({
          show: false,
          title: '操作确认',
          message: '',
          confirmText: '确定',
          cancelText: '取消',
          type: 'danger',
          onConfirm: () => {},
          onCancel: () => {}
        });

        const confirmAction = ({ title, message, confirmText = '确定', cancelText = '取消', type = 'danger' }) => {
          return new Promise((resolve) => {
            confirmModal.value = {
              show: true,
              title: title || '操作确认',
              message: message || '确定要执行此操作吗？',
              confirmText,
              cancelText,
              type,
              onConfirm: () => {
                confirmModal.value.show = false;
                resolve(true);
              },
              onCancel: () => {
                confirmModal.value.show = false;
                resolve(false);
              }
            };
          });
        };

        // 全局杜绝黑框 alert
        window.alert = (msg) => {
          showToastNotification(msg, 'info');
        };

        // 管理员独立网关专属登录状态
        const adminLoginForm = ref({ identifier: '', password: '' });
        const adminLoginLoading = ref(false);
        const adminLoginError = ref('');

        const sectionTitles = {
          overview: '系统运行概览',
          users: '用户管理中心',
          announcements: '官方公告与动态资讯管理',
          security: '云端防御 & Cloudflare Turnstile',
          tasks: '全局任务流水审计',
          workflows: '工作流资产调度与上下架治理',
          keys: 'API 密钥池与并发调度', cdkeys: '卡密发行与核销对账台账',
          gallery: '全站画廊与自建图床资产管控'
        };

        // 画廊与图床专属状态
        const adminGallery = ref([]);
        const adminGalleryLoading = ref(false);
        const galleryUserFilter = ref('all');
        const galleryTypeFilter = ref('all');
        const galleryStorageFilter = ref('all');
        const galleryStatusFilter = ref('all');
        const imgbedInfo = ref({ totalOutputs: 0, syncedOutputs: 0, pendingSync: 0 });
        const showImgbedModal = ref(false);
        const testingImgbed = ref(false);
        const syncingAllImgbed = ref(false);
        const syncingPending = ref(false);
        const syncProgressText = ref('');
        const imgbedForm = ref({
          enabled: true,
          uploadUrl: 'https://imgbed.2364498.xyz/upload',
          authHeader: '',
          rootFolder: 'RunComfyui',
          isolateByUser: true,
          concurrency: 3
        });

        const galleryUniqueUsers = computed(() => {
          const s = new Set();
          for (const item of adminGallery.value) {
            if (item.username) s.add(item.username);
          }
          return Array.from(s).sort();
        });

        const overview = ref({});
        const users = ref([]);
        const userSearchQuery = ref('');
        const announcements = ref([]);
        const allTasks = ref([]);
        const taskFilterStatus = ref('ALL');
        const taskFilterUser = ref('');
        const taskFilterLoading = ref(false);

        const workflows = ref([]);
        const workflowsLoading = ref(false);
        const workflowFilter = ref('ALL');

        const broadcastForm = ref({
          enabled: false,
          message: '🔥 欢迎体验全新一代 ComfyUI 云端工作流创作平台！',
          level: 'info'
        });
        const maintenanceForm = ref({
          enabled: false,
          message: '系统正在进行云端算力节点升级维护，暂不可提交新生成任务，请稍后访问。'
        });

        const filteredWorkflows = computed(() => {
          if (workflowFilter.value === 'OFFICIAL') {
            return workflows.value.filter(w => Boolean(w.isOfficial));
          }
          if (workflowFilter.value === 'USER') {
            return workflows.value.filter(w => !w.isOfficial);
          }
          if (workflowFilter.value === 'ACTIVE') {
            return workflows.value.filter(w => w.isActive !== false);
          }
          if (workflowFilter.value === 'INACTIVE') {
            return workflows.value.filter(w => w.isActive === false);
          }
          return workflows.value;
        });
        const keys = ref([]);

        const systemConfig = ref({
          siteTitle: 'RunningHub Cloud Studio',
          allowRegistration: true,
          requireLoginToGenerate: false,
          turnstileEnabled: false,
          turnstileSiteKey: '',
          turnstileSecretKey: '',
          hasTurnstileSecret: false,
          turnstileSecretKeyMasked: '',
          defaultUserPoints: 100,
          hideAuxiliaryAudioChain: true
        });

        // 弹窗状态
        const annoModal = ref({
          show: false,
          isEdit: false,
          id: '',
          form: { title: '', content: '', tag: '官方公告', isActive: true }
        });
        const editPointsModal = ref({ show: false, userId: '', username: '', points: 0 });
        const resetPwdModal = ref({ show: false, userId: '', username: '', newPassword: '' });
        const showAddKeyModal = ref(false);
        const showSmtpModal = ref(false);
        const smtpTesting = ref(false);
        const isInspectingKeys = ref(false);
        const smtpForm = ref({
          enabled: false,
          host: 'smtp.qq.com',
          port: 465,
          user: '',
          password: '',
          adminEmail: '',
          hasPassword: false
        });
        const newKeyForm = ref({ name: '', apiKey: '' });

        let _iconRefreshTimer = null;
        const refreshIcons = () => {
          if (_iconRefreshTimer) return;
          _iconRefreshTimer = setTimeout(() => {
            _iconRefreshTimer = null;
            nextTick(() => {
              try {
                if (window.lucide && typeof window.lucide.createIcons === 'function') {
                  window.lucide.createIcons();
                }
              } catch (err) {
                console.warn('Lucide icon refresh ignored:', err);
              }
            });
          }, 30);
        };

        // 统一鉴权 Fetch
        const authFetch = async (url, options = {}) => {
          const token = localStorage.getItem('rh_admin_token') || localStorage.getItem('rh_auth_token');
          options.headers = {
            ...options.headers,
            'Authorization': token ? `Bearer ${token}` : ''
          };
          const res = await fetch(url, options);
          return res;
        };

        // 检查管理员身份
        const checkAdminAuth = async () => {
          const token = localStorage.getItem('rh_admin_token') || localStorage.getItem('rh_auth_token');
          if (!token) {
            authChecked.value = true;
            refreshIcons();
            return;
          }
          try {
            const res = await authFetch('/api/auth/me');
            if (res.ok) {
              const u = await res.json();
              if (u.role === 'admin') {
                currentUser.value = u;
                loadAllData();
              } else {
                currentUser.value = null;
              }
            } else {
              currentUser.value = null;
            }
          } catch (e) {
            currentUser.value = null;
          } finally {
            authChecked.value = true;
            refreshIcons();
          }
        };

        // 管理员独立网关提交登录
        const submitAdminLogin = async () => {
          adminLoginError.value = '';
          adminLoginLoading.value = true;
          try {
            const res = await fetch('/api/admin/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                identifier: adminLoginForm.value.identifier.trim(),
                password: adminLoginForm.value.password
              })
            });
            const data = await res.json();
            if (!res.ok) {
              throw new Error(data.detail || '管理员身份验证失败');
            }
            if (data.token) {
              localStorage.setItem('rh_admin_token', data.token);
              localStorage.setItem('rh_auth_token', data.token);
              currentUser.value = data.user;
              await loadAllData();
            }
          } catch (err) {
            adminLoginError.value = err.message || '网络连接异常';
          } finally {
            adminLoginLoading.value = false;
            refreshIcons();
          }
        };

        const logoutAdmin = () => {
          localStorage.removeItem('rh_admin_token');
          currentUser.value = null;
          authChecked.value = true;
          refreshIcons();
        };

        // 加载全部初始数据
        const loadAllData = async () => {
          loading.value = true;
          try {
            await Promise.all([
              loadOverview(),
              loadUsers(),
              loadAnnouncements(),
              loadSystemSettings(),
              loadTasks(),
              loadWorkflows(),
              loadKeys(),
              loadAdminGallery(),
              loadImgbedInfo(),
              loadCdkeys(1)
            ]);
          } finally {
            loading.value = false;
            refreshIcons();
          }
        };

        const loadOverview = async () => {
          const res = await authFetch('/api/admin/overview');
          if (res.ok) overview.value = await res.json();
        };

        const loadUsers = async () => {
          const res = await authFetch('/api/admin/users');
          if (res.ok) users.value = await res.json();
        };

        const loadAnnouncements = async () => {
          const res = await authFetch('/api/admin/announcements');
          if (res.ok) announcements.value = await res.json();
        };

        const loadSystemSettings = async () => {
          const res = await authFetch('/api/admin/system');
          if (res.ok) systemConfig.value = await res.json();
        };

        const loadTasks = async () => {
          taskFilterLoading.value = true;
          try {
            const params = new URLSearchParams();
            if (taskFilterStatus.value && taskFilterStatus.value !== 'ALL') {
              params.append('status', taskFilterStatus.value);
            }
            if (taskFilterUser.value) {
              params.append('user_id', taskFilterUser.value);
            }
            const res = await authFetch('/api/admin/tasks?' + params.toString());
            if (res.ok) allTasks.value = await res.json();
          } finally {
            taskFilterLoading.value = false;
          }
        };

        const adminCancelTask = async (taskId) => {
          const ok = await confirmAction({
            title: '强制取消任务',
            message: `确定要强制中断并取消任务 [${taskId}] 吗？系统将自动向 RunningHub 发出中断请求，并全额退还该任务的算力币。`,
            confirmText: '强制取消并退费',
            type: 'danger'
          });
          if (!ok) return;

          try {
            const res = await authFetch(`/api/admin/tasks/${taskId}/cancel`, { method: 'POST' });
            if (res.ok) {
              const data = await res.json();
              showToastNotification(data.message || '任务已成功强制取消', 'success');
              await loadTasks();
            } else {
              const err = await res.json();
              showToastNotification('操作失败: ' + (err.detail || '未知错误'), 'error');
            }
          } catch (e) {
            showToastNotification('请求失败: ' + e.message, 'error');
          }
        };

        const adminDeleteTask = async (taskId) => {
          const ok = await confirmAction({
            title: '清理任务记录',
            message: `确定要彻底删除任务 [${taskId}] 的台账记录吗？此操作无法撤销。`,
            confirmText: '确认清理',
            type: 'danger'
          });
          if (!ok) return;

          try {
            const res = await authFetch(`/api/admin/tasks/${taskId}`, { method: 'DELETE' });
            if (res.ok) {
              showToastNotification('任务记录已成功清理', 'success');
              allTasks.value = allTasks.value.filter(t => t.taskId !== taskId);
            } else {
              const err = await res.json();
              showToastNotification('清理失败: ' + (err.detail || '未知错误'), 'error');
            }
          } catch (e) {
            showToastNotification('清理失败: ' + e.message, 'error');
          }
        };

        const adminBatchCleanTasks = async (status) => {
          const statusText = status === 'CANCELLED' ? '已取消' : (status === 'FAILED' ? '失败' : status);
          const ok = await confirmAction({
            title: `批量清理${statusText}任务`,
            message: `确定要一键清理全站所有处于【${statusText}】状态的历史任务记录吗？这将彻底清空这些记录。`,
            confirmText: '一键清空',
            type: 'danger'
          });
          if (!ok) return;

          try {
            const res = await authFetch('/api/admin/tasks/clean-batch', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status })
            });
            if (res.ok) {
              const data = await res.json();
              showToastNotification(data.message || '清理完成', 'success');
              await loadTasks();
            } else {
              const err = await res.json();
              showToastNotification('批量清理失败', 'error');
            }
          } catch (e) {
            showToastNotification('网络请求失败', 'error');
          }
        };

        const loadWorkflows = async () => {
          workflowsLoading.value = true;
          try {
            const res = await authFetch('/api/admin/workflows');
            if (res.ok) {
              workflows.value = await res.json();
            }
          } catch (e) {
            console.error('Failed to load workflows', e);
          } finally {
            workflowsLoading.value = false;
            await nextTick();
            refreshIcons();
          }
        };

        const adminToggleWorkflowActive = async (wfId) => {
          try {
            const res = await authFetch(`/api/admin/workflows/${wfId}/toggle-active`, { method: 'POST' });
            if (res.ok) {
              const data = await res.json();
              showToastNotification(data.isActive ? '工作流已成功上架' : '工作流已下架停用', 'success');
              await loadWorkflows();
            }
          } catch (e) {
            showToastNotification('操作失败', 'error');
          }
        };

        const adminToggleWorkflowPin = async (wfId) => {
          try {
            const res = await authFetch(`/api/admin/workflows/${wfId}/toggle-pin`, { method: 'POST' });
            if (res.ok) {
              const data = await res.json();
              showToastNotification(data.isPinned ? '工作流已成功置顶' : '已取消置顶', 'success');
              await loadWorkflows();
            }
          } catch (e) {
            showToastNotification('操作失败', 'error');
          }
        };

        const adminToggleWorkflowOfficial = async (wfId) => {
          try {
            const res = await authFetch(`/api/admin/workflows/${wfId}/toggle-official`, { method: 'POST' });
            if (res.ok) {
              const data = await res.json();
              showToastNotification(data.isOfficial ? '已设为官方预设工作流' : '已改为用户自建工作流', 'success');
              await loadWorkflows();
            }
          } catch (e) {
            showToastNotification('操作失败', 'error');
          }
        };

        const handleConfirmModalConfirm = () => {
          if (confirmModal.value && typeof confirmModal.value.onConfirm === 'function') {
            confirmModal.value.onConfirm();
          } else {
            confirmModal.value.show = false;
          }
        };

        const handleConfirmModalCancel = () => {
          if (confirmModal.value && typeof confirmModal.value.onCancel === 'function') {
            confirmModal.value.onCancel();
          } else {
            confirmModal.value.show = false;
          }
        };

        const adminDeleteWorkflow = async (wf) => {
          if (!wf || !wf.id) return;
          const wfName = wf.name || wf.id;
          const ok = await confirmAction({
            title: '删除工作流',
            message: `确定要彻底删除工作流 [${wfName}] 吗？删除后前台所有相关用户将不可见。`,
            confirmText: '确认删除',
            type: 'danger'
          });
          if (!ok) return;

          try {
            const res = await authFetch(`/api/admin/workflows/${encodeURIComponent(wf.id)}`, { method: 'DELETE' });
            if (res.ok) {
              showToastNotification(`工作流 [${wfName}] 已成功删除`, 'success');
              workflows.value = workflows.value.filter(w => String(w.id) !== String(wf.id));
              await loadWorkflows();
            } else {
              const err = await res.json().catch(() => ({}));
              showToastNotification(err.detail || '删除失败，请稍后重试', 'error');
            }
          } catch (e) {
            showToastNotification('删除异常: ' + e.message, 'error');
          }
        };

        const deleteCurrentEditingWorkflow = async () => {
          const form = workflowModal.value.form;
          const targetId = form.originalId || form.id;
          if (!targetId) return;
          const wfObj = workflows.value.find(w => String(w.id) === String(targetId)) || { id: targetId, name: form.name };
          workflowModal.value.show = false;
          await adminDeleteWorkflow(wfObj);
        };

        const workflowModal = ref({
          show: false,
          isEdit: false,
          sourceType: 'cloud',
          inspecting: false,
          uploadingCover: false,
          parsingJson: false,
          inspectResult: null,
          saving: false,
          form: {
            id: '',
            originalId: null,
            name: '',
            category: '官方预设',
            pointsCost: 5,
            coverImage: '',
            description: '',
            isOfficial: true,
            isActive: true,
            isPinned: false,
            customPrompt: null,
            defaultParams: null
          }
        });
        const workflowFileInput = ref(null);
        const workflowCoverInput = ref(null);

        const openAddWorkflowModal = () => {
          workflowModal.value = {
            show: true,
            isEdit: false,
            sourceType: 'cloud',
            inspecting: false,
            uploadingCover: false,
            parsingJson: false,
            inspectResult: null,
            saving: false,
            form: {
              id: '',
              originalId: null,
              name: '',
              category: '官方预设',
              pointsCost: 5,
              coverImage: '',
              description: '',
              isOfficial: true,
              isActive: true,
              isPinned: false,
              customPrompt: null,
              defaultParams: null
            }
          };
          refreshIcons();
        };

        const openEditWorkflowModal = (wf) => {
          workflowModal.value = {
            show: true,
            isEdit: true,
            sourceType: 'cloud',
            inspecting: false,
            uploadingCover: false,
            parsingJson: false,
            inspectResult: null,
            saving: false,
            form: {
              id: String(wf.id || ''),
              originalId: String(wf.id || ''),
              name: wf.name || '',
              category: wf.category || '官方预设',
              pointsCost: wf.pointsCost !== undefined ? wf.pointsCost : 5,
              coverImage: wf.coverImage || '',
              description: wf.description || '',
              isOfficial: wf.isOfficial !== undefined ? wf.isOfficial : true,
              isActive: wf.isActive !== undefined ? wf.isActive : true,
              isPinned: wf.isPinned !== undefined ? wf.isPinned : false,
              customPrompt: wf.customPrompt || null,
              defaultParams: wf.defaultParams || null
            }
          };
          refreshIcons();
        };

        const closeWorkflowModal = () => {
          workflowModal.value.show = false;
        };

        const inspectCloudWorkflowInModal = async () => {
          const wfId = workflowModal.value.form.id.trim();
          if (!wfId) {
            showToastNotification('请先输入云端工作流 ID', 'error');
            return;
          }
          workflowModal.value.inspecting = true;
          try {
            const res = await authFetch('/api/workflows/inspect', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ workflowId: wfId })
            });
            const data = await res.json();
            if (res.ok && data.status === 'ok') {
              workflowModal.value.inspectResult = data;
              if (!workflowModal.value.form.name) {
                workflowModal.value.form.name = 'RunningHub 工作流 ' + wfId;
              }
              showToastNotification(`探测成功，识别出 ${data.totalNodes} 个节点拓扑`, 'success');
              refreshIcons();
            } else {
              showToastNotification(data.detail || '探测工作流失败，请核对工作流 ID', 'error');
            }
          } catch (e) {
            showToastNotification('探测异常: ' + e.message, 'error');
          } finally {
            workflowModal.value.inspecting = false;
            refreshIcons();
          }
        };

        const triggerWorkflowJsonSelect = () => {
          workflowFileInput.value?.click();
        };

        const handleWorkflowJsonFile = async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          workflowModal.value.parsingJson = true;
          try {
            const formData = new FormData();
            formData.append('file', file);
            const res = await authFetch('/api/workflows/parse_json', {
              method: 'POST',
              body: formData
            });
            const data = await res.json();
            if (res.ok && data.status === 'ok') {
              workflowModal.value.inspectResult = data;
              workflowModal.value.form.customPrompt = data.customPrompt || data.rawPrompt;
              if (!workflowModal.value.form.id) {
                workflowModal.value.form.id = 'wf_json_' + Date.now().toString(36);
              }
              if (!workflowModal.value.form.name) {
                const baseName = file.name.replace(/\.[^/.]+$/, "");
                workflowModal.value.form.name = baseName || '自定义本地工作流';
              }
              showToastNotification(`JSON 解析成功！解析出 ${data.totalNodes} 个节点`, 'success');
              refreshIcons();
            } else {
              showToastNotification(data.detail || '工作流 JSON 解析失败', 'error');
            }
          } catch (e) {
            showToastNotification('解析异常: ' + e.message, 'error');
          } finally {
            workflowModal.value.parsingJson = false;
            if (e.target) e.target.value = '';
            refreshIcons();
          }

            });
            if (res.ok) {
              editPointsModal.value.show = false;
              showToastNotification('算力点数已更新', 'success');
              await loadUsers();
            }
          } catch (e) {
            showToastNotification('点数修改失败: ' + e.message, 'error');
          }
        };

        const toggleUserRole = async (u) => {
          const newRole = u.role === 'admin' ? 'user' : 'admin';
          const ok = await confirmAction({
            title: '修改权限',
            message: `确定将用户 ${u.username} 的权限修改为【${newRole === 'admin' ? '超级管理员' : '普通用户'}】吗？`,
            confirmText: '确认修改',
            type: 'warning'
          });
          if (!ok) return;
          try {
            const res = await authFetch(`/api/admin/users/${u.id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ role: newRole })
            });
            if (res.ok) {
              showToastNotification('用户权限已更新', 'success');
              await loadUsers();
            }
          } catch (e) {
            showToastNotification('角色修改失败: ' + e.message, 'error');
          }
        };

        const toggleUserActive = async (u) => {
          try {
            const res = await authFetch(`/api/admin/users/${u.id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ isActive: !u.isActive })
            });
            if (res.ok) {
              showToastNotification('用户状态已更新', 'success');
              await loadUsers();
            }
          } catch (e) {
            showToastNotification('状态更新失败: ' + e.message, 'error');
          }
        };

        const openResetPassword = (u) => {
          resetPwdModal.value = { show: true, userId: u.id, username: u.username, newPassword: '' };
        };

        const submitResetPassword = async () => {
          if (!resetPwdModal.value.newPassword || resetPwdModal.value.newPassword.length < 6) {
            showToastNotification('密码长度至少 6 位', 'warning');
            return;
          }
          try {
            const res = await authFetch(`/api/admin/users/${resetPwdModal.value.userId}/reset-password`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ newPassword: resetPwdModal.value.newPassword })
            });
            if (res.ok) {
              showToastNotification('密码已成功重置！', 'success');
              resetPwdModal.value.show = false;
            }
          } catch (e) {
            showToastNotification('重置密码失败: ' + e.message, 'error');
          }
        };

        // 密钥池操作
        const submitAddKey = async () => {
          if (!newKeyForm.value.apiKey.trim()) return;
          try {
            const res = await authFetch('/api/keys', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(newKeyForm.value)
            });
            if (res.ok) {
              showAddKeyModal.value = false;
              newKeyForm.value = { name: '', apiKey: '' };
              showToastNotification('API 密钥已添加并安全加密', 'success');
              await loadKeys();
            }
          } catch (e) {
            showToastNotification('密钥添加失败: ' + e.message, 'error');
          }
        };

        const setActiveKey = async (keyId) => {
          try {
            const res = await authFetch(`/api/keys/${keyId}/activate`, { method: 'POST' });
            if (res.ok) {
              showToastNotification('已切换活跃 API Key', 'success');
              await loadKeys();
            }
          } catch (e) {
            showToastNotification('切换失败: ' + e.message, 'error');
          }
        };

        const deleteKey = async (keyId) => {
          const ok = await confirmAction({
            title: '删除 API 密钥',
            message: '确定删除此 API 密钥吗？删除后将无法恢复。',
            confirmText: '确认删除',
            type: 'danger'
          });
          if (!ok) return;
          try {
            const res = await authFetch(`/api/keys/${keyId}`, { method: 'DELETE' });
            if (res.ok) {
              showToastNotification('API 密钥已删除', 'success');
              await loadKeys();
            }
          } catch (e) {
            showToastNotification('删除失败: ' + e.message, 'error');
          }
        };

        
        // ================= 卡密发行与对账台账状态 =================
        const cdkeyStats = ref({ unusedCount: 0, usedCount: 0, voidCount: 0, totalPointsIssued: 0 });
        const cdkeyList = ref([]);
        const cdkeyFilter = ref('ALL');
        const cdkeySearch = ref('');
        const cdkeyPage = ref(1);
        const cdkeyPageSize = ref(50);
        const cdkeyTotal = ref(0);
        const cdkeyLoading = ref(false);
        const showGenerateCdkeyModal = ref(false);
        const generateCdkeyForm = ref({ points: 100, count: 20, remark: '' });
        const generatedCdkeys = ref([]);
        const generatingCdkeys = ref(false);

        // Key Pool 实时并发状态
        const keyPoolStats = ref({ totalKeys: 0, busyKeys: 0, freeKeys: 0, waitingTasks: 0 });
        const keyPoolItems = ref([]);

        const getKeyPoolItem = (keyId) => {
          return keyPoolItems.value.find(k => k.id === keyId);
        };

        const loadKeyPoolStatus = async () => {
          try {
            const res = await authFetch('/api/admin/key-pool/status');
            if (res.ok) {
              const data = await res.json();
              keyPoolStats.value = data.stats || {};
              keyPoolItems.value = data.keys || [];
            }
          } catch (e) {
            console.error('Failed to load key pool status:', e);
          }
        };

        const inspectAllKeys = async () => {
          isInspectingKeys.value = true;
          try {
            const res = await authFetch('/api/admin/key-pool/inspect', { method: 'POST' });
            if (res.ok) {
              const data = await res.json();
              showToastNotification(`巡检完毕：${data.healthyCount} 个账号健康，${data.bannedCount} 个异常`, data.bannedCount > 0 ? 'warning' : 'success');
              await loadKeyPoolStatus();
              await loadKeys();
            } else {
              const err = await res.json();
              showToastNotification('巡检失败: ' + (err.detail || '接口响应异常'), 'error');
            }
          } catch (e) {
            showToastNotification('巡检请求异常: ' + e.message, 'error');
          } finally {
            isInspectingKeys.value = false;
            refreshIcons();
          }
        };

        const resumeKeyInPool = async (keyId) => {
          try {
            const res = await authFetch(`/api/admin/key-pool/${keyId}/resume`, { method: 'POST' });
            if (res.ok) {
              showToastNotification('已解除熔断隔离，Key 恢复加入调度池', 'success');
              await loadKeyPoolStatus();
            } else {
              const err = await res.json();
              showToastNotification('恢复失败: ' + (err.detail || '接口响应异常'), 'error');
            }
          } catch (e) {
            showToastNotification('请求失败: ' + e.message, 'error');
          }
        };

        const openSmtpModal = async () => {
          showSmtpModal.value = true;
          refreshIcons();
          try {
            const res = await authFetch('/api/admin/system/smtp');
            if (res.ok) {
              const data = await res.json();
              smtpForm.value.enabled = !!data.enabled;
              smtpForm.value.host = data.host || 'smtp.qq.com';
              smtpForm.value.port = data.port || 465;
              smtpForm.value.user = data.user || '';
              smtpForm.value.adminEmail = data.adminEmail || '';
              smtpForm.value.hasPassword = !!data.hasPassword;
              smtpForm.value.password = '';
            }
          } catch (e) {
            console.error('Failed to load SMTP settings:', e);
          }
        };

        const saveSmtpConfig = async () => {
          try {
            const payload = {
              enabled: smtpForm.value.enabled,
              host: smtpForm.value.host,
              port: parseInt(smtpForm.value.port || 465),
              user: smtpForm.value.user,
              password: smtpForm.value.password ? smtpForm.value.password : undefined,
              adminEmail: smtpForm.value.adminEmail
            };
            const res = await authFetch('/api/admin/system/smtp', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (res.ok) {
              showToastNotification('SMTP 告警设置已保存', 'success');
              showSmtpModal.value = false;
            } else {
              const err = await res.json();
              showToastNotification('保存失败: ' + (err.detail || '未知错误'), 'error');
            }
          } catch (e) {
            showToastNotification('网络异常: ' + e.message, 'error');
          }
        };

        const testSmtpEmail = async () => {
          smtpTesting.value = true;
          try {
            const res = await authFetch('/api/admin/system/smtp/test', { method: 'POST' });
            if (res.ok) {
              showToastNotification('测试邮件已成功发送，请查收', 'success');
            } else {
              const err = await res.json();
              showToastNotification('测试发送失败: ' + (err.detail || '未知原因'), 'error');
            }
          } catch (e) {
            showToastNotification('测试请求异常: ' + e.message, 'error');
          } finally {
            smtpTesting.value = false;
          }
        };

        const resetKeyInPool = async (keyId) => {
          try {
            const res = await authFetch(`/api/admin/key-pool/${keyId}/reset`, { method: 'POST' });
            if (res.ok) {
              showToastNotification('已强制重置 Key 为空闲状态', 'success');
              await loadKeyPoolStatus();
            }
          } catch (e) {
            showToastNotification('重置失败: ' + e.message, 'error');
          }
        };

        const loadCdkeys = async (page = 1) => {
          cdkeyPage.value = page;
          cdkeyLoading.value = true;
          try {
            const q = new URLSearchParams({
              status: cdkeyFilter.value,
              page: String(page),
              pageSize: String(cdkeyPageSize.value),
              search: cdkeySearch.value.trim()
            });
            const res = await authFetch(`/api/admin/cdkeys?${q.toString()}`);
            if (res.ok) {
              const data = await res.json();
              cdkeyList.value = data.items || [];
              cdkeyTotal.value = data.total || 0;
              cdkeyStats.value = {
                unusedCount: data.unusedCount || 0,
                usedCount: data.usedCount || 0,
                voidCount: data.voidCount || 0,
                totalPointsIssued: data.totalPointsIssued || 0
              };
            }
          } catch (e) {
            showToastNotification('加载卡密失败: ' + e.message, 'error');
          } finally {
            cdkeyLoading.value = false;
            setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 50);
          }
        };

        const openGenerateCdkeyModal = () => {
          const today = new Date().toISOString().split('T')[0];
          generateCdkeyForm.value = { points: 100, count: 20, remark: `闲鱼发卡 ${today}` };
          generatedCdkeys.value = [];
          showGenerateCdkeyModal.value = true;
          setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 50);
        };

        const closeGenerateCdkeyModal = () => {
          showGenerateCdkeyModal.value = false;
          generatedCdkeys.value = [];
          loadCdkeys(1);
        };

        const submitGenerateCdkeys = async () => {
          generatingCdkeys.value = true;
          try {
            const res = await authFetch('/api/admin/cdkeys/generate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(generateCdkeyForm.value)
            });
            const data = await res.json();
            if (res.ok) {
              generatedCdkeys.value = data.codes || [];
              showToastNotification(`成功发行 ${data.count} 张卡密！`, 'success');
            } else {
              showToastNotification(data.detail || '生成失败', 'error');
            }
          } catch (e) {
            showToastNotification('请求失败: ' + e.message, 'error');
          } finally {
            generatingCdkeys.value = false;
            setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 50);
          }
        };

        const copyAllGeneratedCdkeys = () => {
          const text = generatedCdkeys.value.join('\n');
          copyToClipboard(text);
          showToastNotification(`已成功复制 ${generatedCdkeys.value.length} 张卡密纯文本至剪贴板，可直接粘贴到闲管家！`, 'success');
        };

        const exportAndCopyUnusedCdkeys = async () => {
          try {
            const res = await authFetch('/api/admin/cdkeys/export');
            if (res.ok) {
              const data = await res.json();
              if (data.count === 0) {
                showToastNotification('当前没有未使用的卡密', 'warning');
                return;
              }
              copyToClipboard(data.rawText);
              showToastNotification(`已复制 ${data.count} 张有效未核销卡密，直接粘贴到闲管家库存！`, 'success');
            }
          } catch (e) {
            showToastNotification('导出失败: ' + e.message, 'error');
          }
        };

        const voidCdkey = async (code) => {
          const ok = await confirmAction({
            title: '作废卡密',
            message: `确定作废卡密 ${code} 吗？作废后用户将无法再兑换充值。`,
            confirmText: '确认作废',
            type: 'danger'
          });
          if (!ok) return;
          try {
            const res = await authFetch(`/api/admin/cdkeys/${encodeURIComponent(code)}/void`, { method: 'POST' });
            if (res.ok) {
              showToastNotification(`卡密 ${code} 已作废`, 'success');
              await loadCdkeys(cdkeyPage.value);
            }
          } catch (e) {
            showToastNotification('作废失败: ' + e.message, 'error');
          }
        };

        const deleteCdkey = async (code) => {
          const ok = await confirmAction({
            title: '删除卡密记录',
            message: `确定彻底删除卡密 ${code} 的记录吗？`,
            confirmText: '确认删除',
            type: 'danger'
          });
          if (!ok) return;
          try {
            const res = await authFetch(`/api/admin/cdkeys/${encodeURIComponent(code)}`, { method: 'DELETE' });
            if (res.ok) {
              showToastNotification(`卡密记录已删除`, 'success');
              await loadCdkeys(cdkeyPage.value);
            }
          } catch (e) {
            showToastNotification('删除失败: ' + e.message, 'error');
          }
        };

        const formatTimestamp = (ts) => {
          if (!ts) return '-';
          const d = new Date(ts * 1000);
          return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        };

        const getStatusBadge = (status) => {
          switch (status) {
            case 'SUCCESS': return 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30';
            case 'RUNNING': return 'bg-indigo-500/15 text-indigo-400 border border-indigo-500/30';
            case 'FAILED': return 'bg-rose-500/15 text-rose-400 border border-rose-500/30';
            default: return 'bg-slate-800 text-slate-400';
          }
        };

        // 自动静默轮询看板：当管理员在 'keys' 页面时，每 2.5 秒自动同步一次并发池状态，指示灯原地实时变绿，无需手动刷新！
        let keyPoolLiveTimer = null;
        onMounted(() => {
          checkAdminAuth();
          keyPoolLiveTimer = setInterval(() => {
            if (activeSection.value === 'keys' || activeSection.value === 'overview') {
              loadKeyPoolStatus();
            }
          }, 2500);
        });

        return {
                    cdkeyStats,
          cdkeyList,
          cdkeyFilter,
          cdkeySearch,
          cdkeyPage,
          cdkeyPageSize,
          cdkeyTotal,
          cdkeyLoading,
          showGenerateCdkeyModal,
          generateCdkeyForm,
          generatedCdkeys,
          generatingCdkeys,
          keyPoolStats,
          keyPoolItems,
          getKeyPoolItem,
          loadKeyPoolStatus,
          resetKeyInPool,
          loadCdkeys,
          openGenerateCdkeyModal,
          closeGenerateCdkeyModal,
          submitGenerateCdkeys,
          copyAllGeneratedCdkeys,
          exportAndCopyUnusedCdkeys,
          voidCdkey,
          deleteCdkey,
          toastState,
          showToastNotification,
          confirmModal,
          confirmAction,
          authChecked,
          currentUser,
          activeSection,
          sectionTitles,
          loading,
          savingSettings,
          adminLoginForm,
          adminLoginLoading,
          adminLoginError,
          overview,
          users,
          userSearchQuery,
          filteredUsers,
          announcements,
          annoModal,
          allTasks,
          taskFilterStatus,
          taskFilterUser,
          taskFilterLoading,
          adminCancelTask,
          adminDeleteTask,
          adminBatchCleanTasks,
          workflows,
          workflowFilter,
          filteredWorkflows,
          loadWorkflows,
          adminToggleWorkflowActive,
          adminToggleWorkflowPin,
          adminToggleWorkflowOfficial,
          adminDeleteWorkflow,
          deleteCurrentEditingWorkflow,
          handleConfirmModalConfirm,
          handleConfirmModalCancel,
          workflowModal,
          workflowFileInput,
          workflowCoverInput,
          openAddWorkflowModal,
          openEditWorkflowModal,
          closeWorkflowModal,
          inspectCloudWorkflowInModal,
          triggerWorkflowJsonSelect,
          handleWorkflowJsonFile,
          triggerCoverUpload,
          handleCoverFileUpload,
          submitWorkflowForm,
          broadcastForm,
          maintenanceForm,
          saveBroadcast,
          toggleMaintenance,
          saveMaintenanceMessage,
          keys,
          systemConfig,
          editPointsModal,
          resetPwdModal,
          showAddKeyModal,
          showSmtpModal,
          smtpTesting,
          isInspectingKeys,
          smtpForm,
          inspectAllKeys,
          resumeKeyInPool,
          openSmtpModal,
          saveSmtpConfig,
          testSmtpEmail,
          newKeyForm,
          refreshCurrentSection,
          loadTasks,
          loadAnnouncements,
          saveSystemSettings,
          saveSystemSettingsQuick,
          openCreateAnnouncement,
          openEditAnnouncement,
          submitSaveAnnouncement,
          toggleAnnouncementActive,
          deleteAnnouncement,
          openEditPoints,
          submitEditPoints,
          toggleUserRole,
          toggleUserActive,
          openResetPassword,
          submitResetPassword,
          submitAddKey,
          setActiveKey,
          deleteKey,
          submitAdminLogin,
          logoutAdmin,
          formatTimestamp,
          getStatusBadge,
          adminGallery,
          adminGalleryLoading,
          galleryUserFilter,
          galleryTypeFilter,
          galleryStorageFilter,
          galleryUniqueUsers,
          imgbedInfo,
          showImgbedModal,
          testingImgbed,
          syncingAllImgbed,
          imgbedForm,
          loadAdminGallery,
          loadImgbedInfo,
          openImgbedModal,
          testImgbedConnection,
          submitSaveImgbedConfig,
          syncAllToImgbed,
          syncingPending,
          syncProgressText,
          syncPendingToImgbed,
          adminBackupSingleItem,
          adminDeleteGalleryRecord,
          adminDeleteGalleryItem: adminDeleteGalleryRecord,
          adminTakedownGalleryItem,
          adminRestoreGalleryItem,
          workflowsLoading,
          onMediaLoadError,
          handleMediaError,
          copyToClipboard,
          galleryStatusFilter
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
